{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Newsreader:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">Kaspa Till</a>
    <a class="tiny" href="https://x.com/StppStp">@StppStp</a>
    <nav>
      <a href="/idea" class="{{if eq .Active "idea"}}on{{end}}">Idea</a>
      <a href="/" class="{{if eq .Active "home"}}on{{end}}">Home</a>
      <a href="/shop" class="{{if eq .Active "shop"}}on{{end}}">Shop</a>
      <a href="/vision" class="{{if eq .Active "vision"}}on{{end}}">Vision</a>
      <a href="/rate" class="{{if eq .Active "rate"}}on{{end}}">Rate</a>
      <a href="/orders" class="{{if eq .Active "orders"}}on{{end}}">Orders</a>
      <a href="/honest" class="{{if eq .Active "honest"}}on{{end}}">Claims</a>
      <a href="/wallets" class="{{if eq .Active "wallets"}}on{{end}}">Wallets</a>
      <a href="/feedback" class="{{if eq .Active "feedback"}}on{{end}}">Feedback</a>
      <a href="/safety" class="{{if eq .Active "safety"}}on{{end}}">Safety</a>
    </nav>
    <button class="btn" type="button" data-wallet-connect data-idle-label="Connect wallet">Connect wallet</button>
    <button class="btn ghost" type="button" data-wallet-logout hidden>Log out</button>
    <span class="stamp">kUSD reserved</span>
  </header>
{{end}}
